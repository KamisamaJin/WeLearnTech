<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KIIP Lesson Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="shared/styles/tokens.css" rel="stylesheet">
    <link href="shared/styles/components.css" rel="stylesheet">
    <link href="lesson/home.css" rel="stylesheet">
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="lesson_guide.html" data-i18n-aria="brandAria">
                <span class="brand-mark">KIIP</span>
                <span class="brand-text">
                    <h1 class="brand-title">Lesson Guide</h1>
                    <p class="brand-subtitle" data-i18n="brandSubtitle">Level 1-4 单词、对话、文化和练习入口</p>
                </span>
            </a>
            <div class="top-actions">
                <button class="locale-toggle kiip-language-toggle" id="locale-toggle" type="button">
                    <span class="locale-toggle-text kiip-language-toggle__label" id="locale-toggle-text">中</span>
                </button>
                <a class="icon-link kiip-icon-button" href="grammar_wiki.html" data-i18n-title="grammarWiki" data-i18n-aria="grammarWiki"></a>
            </div>
        </header>

        <main class="main">
            <section class="summary-row">
                <div>
                    <p class="summary-copy" data-i18n="summaryCopy">按 Level 进入课程导学，查看每课的单词、对话、文化文章、练习和发音。</p>
                </div>
            </section>

            <section class="level-grid" data-i18n-aria="levelGridAria">
                <article class="level-card is-ready">
                    <h3 class="level-title">KIIP Level 1</h3>
                    <p class="level-subtitle" data-i18n="level1Subtitle">초급 1 · 基础入门</p>
                    <p class="level-note" data-i18n="level1Note">18 课已接入</p>
                    <a class="card-action" href="lesson_guide_l1.html?v=l1-refined-1">
                        <span data-i18n="enterLevel1">进入 Level 1</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14"></path>
                            <path d="m13 6 6 6-6 6"></path>
                        </svg>
                    </a>
                </article>

                <article class="level-card is-ready">
                    <h3 class="level-title">KIIP Level 2</h3>
                    <p class="level-subtitle" data-i18n="level2Subtitle">초급 2 · 生活表达扩展</p>
                    <p class="level-note" data-i18n="level2Note">18 课已接入</p>
                    <a class="card-action" href="lesson_guide_l2.html?v=no-status-labels">
                        <span data-i18n="enterLevel2">进入 Level 2</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14"></path>
                            <path d="m13 6 6 6-6 6"></path>
                        </svg>
                    </a>
                </article>

                <article class="level-card is-ready">
                    <h3 class="level-title">KIIP Level 3</h3>
                    <p class="level-subtitle" data-i18n="level3Subtitle">중급 1 · 中级表达和文化</p>
                    <p class="level-note" data-i18n="level3Note">16 课已接入</p>
                    <a class="card-action" href="lesson_guide_l3.html?v=no-status-labels">
                        <span data-i18n="enterLevel3">进入 Level 3</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14"></path>
                            <path d="m13 6 6 6-6 6"></path>
                        </svg>
                    </a>
                </article>

                <article class="level-card is-ready">
                    <h3 class="level-title">KIIP Level 4</h3>
                    <p class="level-subtitle" data-i18n="level4Subtitle">중급 2 · 高阶主题表达</p>
                    <p class="level-note" data-i18n="level4Note">16 课目录已接入</p>
                    <a class="card-action" href="lesson_guide_l4.html?v=l4-16-draft-1">
                        <span data-i18n="enterLevel4">进入 Level 4</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14"></path>
                            <path d="m13 6 6 6-6 6"></path>
                        </svg>
                    </a>
                </article>
            </section>
        </main>
    </div>
    <script src="shared/icons.js"></script>
    <script src="shared/locale.js"></script>
    <script src="lesson/home.js"></script>

</html>
