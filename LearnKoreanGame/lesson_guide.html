<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KIIP Lesson Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --panel: #171b22;
            --panel-soft: #202632;
            --line: rgba(226, 232, 240, 0.1);
            --text: #f6f1e8;
            --soft: #c9d2df;
            --muted: #8f9aab;
            --teal: #5fd2c6;
            --teal-rgb: 95, 210, 198;
            --amber: #cda45e;
            --amber-rgb: 205, 164, 94;
            --rose: #d9827a;
            --green: #8fbd9a;
            --shadow: rgba(0,0,0,0.32);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                linear-gradient(180deg, #0f1117 0%, #111821 48%, #0f1117 100%),
                var(--bg);
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px clamp(18px, 4vw, 48px);
            border-bottom: 1px solid var(--line);
            background: rgba(15, 17, 23, 0.94);
            backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            color: #0d1715;
            background: linear-gradient(180deg, #74ddd4, var(--teal));
            font-weight: 900;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-title {
            margin: 0;
            font-size: clamp(1.18rem, 3vw, 1.75rem);
            line-height: 1.05;
            color: var(--teal);
        }

        .brand-subtitle {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }

        .locale-toggle {
            min-width: 54px;
            height: 42px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--soft);
            background: rgba(244, 239, 231, 0.045);
            font: inherit;
            font-weight: 900;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .locale-toggle:hover {
            color: var(--teal);
            border-color: rgba(var(--teal-rgb), 0.44);
            background: rgba(var(--teal-rgb), 0.1);
        }

        .icon-link {
            display: inline-grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--soft);
            background: rgba(244, 239, 231, 0.045);
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .icon-link:hover {
            color: var(--teal);
            border-color: rgba(var(--teal-rgb), 0.44);
            background: rgba(var(--teal-rgb), 0.1);
        }

        .icon-link svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .main {
            width: min(900px, 100%);
            margin: 0 auto;
            padding: clamp(22px, 4vw, 42px) clamp(16px, 4vw, 30px) 38px;
        }

        .summary-row {
            max-width: 680px;
            margin-bottom: 20px;
        }

        .eyebrow {
            margin: 0 0 9px;
            color: var(--amber);
            font-size: 0.86rem;
            font-weight: 900;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .headline {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.6rem);
            line-height: 1.02;
            letter-spacing: 0;
        }

        .summary-copy {
            max-width: 640px;
            margin: 10px 0 0;
            color: var(--soft);
            font-size: clamp(0.98rem, 2vw, 1.08rem);
            line-height: 1.6;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 18px;
        }

        .level-card {
            min-height: 188px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 10px 24px var(--shadow);
        }

        .level-card.is-ready {
            border-color: rgba(var(--teal-rgb), 0.28);
            background: var(--panel);
        }

        .level-title {
            margin: 0;
            font-size: clamp(1.28rem, 2.2vw, 1.7rem);
            line-height: 1.1;
        }

        .level-subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-weight: 800;
        }

        .level-note {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 0.95rem;
            font-weight: 800;
        }

        .card-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            min-height: 44px;
            padding: 0 13px;
            border-radius: 8px;
            color: #0d1715;
            background: linear-gradient(180deg, #74ddd4, var(--teal));
            font-weight: 900;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .card-action:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
        }

        .card-action.disabled {
            color: var(--muted);
            background: rgba(244, 239, 231, 0.06);
            pointer-events: none;
        }

        .card-action svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 1040px) {
            .level-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 720px) {
            .topbar {
                padding: 14px 16px;
            }

            .main {
                padding: 20px 14px 30px;
            }

            .summary-row {
                margin-bottom: 18px;
            }

            .brand-subtitle {
                display: none;
            }

            .level-grid {
                grid-template-columns: 1fr;
            }

            .level-card {
                min-height: auto;
                padding: 16px;
            }

            .card-action {
                margin-top: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="lesson_guide.html" data-i18n-aria="brandAria">
                <span class="brand-mark">KIIP</span>
                <span class="brand-text">
                    <h1 class="brand-title">Lesson Guide</h1>
                    <p class="brand-subtitle" data-i18n="brandSubtitle">Level 1-4 单词、对话、文化和练习入口</p>
                </span>
            </a>
            <div class="top-actions">
                <button class="locale-toggle" id="locale-toggle" type="button">EN</button>
                <a class="icon-link" href="grammar_wiki.html" data-i18n-title="grammarWiki" data-i18n-aria="grammarWiki">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"></path>
                    </svg>
                </a>
            </div>
        </header>

        <main class="main">
            <section class="summary-row" aria-labelledby="home-title">
                <div>
                    <p class="eyebrow">KIIP Textbook Companion</p>
                    <h2 class="headline" id="home-title" data-i18n="headline">选择学习级别</h2>
                    <p class="summary-copy" data-i18n="summaryCopy">按 Level 进入课程导学，查看每课的单词、对话、文化文章、练习和发音。</p>
                </div>
            </section>

            <section class="level-grid" data-i18n-aria="levelGridAria">
                <article class="level-card">
                    <h3 class="level-title">KIIP Level 1</h3>
                    <p class="level-subtitle" data-i18n="level1Subtitle">초급 1 · 基础入门</p>
                    <p class="level-note" data-i18n="preparing">准备接入</p>
                    <span class="card-action disabled" data-i18n="comingSoon">即将开放</span>
                </article>

                <article class="level-card is-ready">
                    <h3 class="level-title">KIIP Level 2</h3>
                    <p class="level-subtitle" data-i18n="level2Subtitle">초급 2 · 生活表达扩展</p>
                    <p class="level-note" data-i18n="level2Note">18 课已接入</p>
                    <a class="card-action" href="lesson_guide_l2.html?v=no-status-labels">
                        <span data-i18n="enterLevel2">进入 Level 2</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14"></path>
                            <path d="m13 6 6 6-6 6"></path>
                        </svg>
                    </a>
                </article>

                <article class="level-card is-ready">
                    <h3 class="level-title">KIIP Level 3</h3>
                    <p class="level-subtitle" data-i18n="level3Subtitle">중급 1 · 中级表达和文化</p>
                    <p class="level-note" data-i18n="level3Note">16 课已接入</p>
                    <a class="card-action" href="lesson_guide_l3.html?v=no-status-labels">
                        <span data-i18n="enterLevel3">进入 Level 3</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14"></path>
                            <path d="m13 6 6 6-6 6"></path>
                        </svg>
                    </a>
                </article>

                <article class="level-card">
                    <h3 class="level-title">KIIP Level 4</h3>
                    <p class="level-subtitle" data-i18n="level4Subtitle">중급 2 · 高阶主题表达</p>
                    <p class="level-note" data-i18n="preparing">准备接入</p>
                    <span class="card-action disabled" data-i18n="comingSoon">即将开放</span>
                </article>
            </section>
        </main>
    </div>
    <script>
        const localeStorageKey = "lessonGuideLocale";
        const translations = {
            "zh-CN": {
                pageTitle: "KIIP Lesson Guide",
                brandAria: "KIIP Lesson Guide 首页",
                brandSubtitle: "Level 1-4 单词、对话、文化和练习入口",
                grammarWiki: "Grammar Wiki",
                languageToggle: "切换到英文",
                languageToggleText: "EN",
                headline: "选择学习级别",
                summaryCopy: "按 Level 进入课程导学，查看每课的单词、对话、文化文章、练习和发音。",
                levelGridAria: "Level 入口",
                preparing: "准备接入",
                comingSoon: "即将开放",
                level1Subtitle: "초급 1 · 基础入门",
                level2Subtitle: "초급 2 · 生活表达扩展",
                level3Subtitle: "중급 1 · 中级表达和文化",
                level4Subtitle: "중급 2 · 高阶主题表达",
                level2Note: "18 课已接入",
                level3Note: "16 课已接入",
                enterLevel2: "进入 Level 2",
                enterLevel3: "进入 Level 3"
            },
            en: {
                pageTitle: "KIIP Lesson Guide",
                brandAria: "KIIP Lesson Guide home",
                brandSubtitle: "Level 1-4 vocabulary, dialogues, culture, and practice",
                grammarWiki: "Grammar Wiki",
                languageToggle: "Switch to Chinese",
                languageToggleText: "中文",
                headline: "Choose A Level",
                summaryCopy: "Open a level to study each lesson's vocabulary, dialogues, culture texts, practice, and pronunciation.",
                levelGridAria: "Level entries",
                preparing: "Preparing",
                comingSoon: "Coming soon",
                level1Subtitle: "Beginner 1 · First steps",
                level2Subtitle: "Beginner 2 · Everyday expressions",
                level3Subtitle: "Intermediate 1 · Expressions and culture",
                level4Subtitle: "Intermediate 2 · Advanced topics",
                level2Note: "18 lessons available",
                level3Note: "16 lessons available",
                enterLevel2: "Open Level 2",
                enterLevel3: "Open Level 3"
            }
        };

        function activeLocale() {
            return localStorage.getItem(localeStorageKey) === "en" ? "en" : "zh-CN";
        }

        function applyLocale(locale) {
            const dictionary = translations[locale] || translations["zh-CN"];
            document.documentElement.lang = locale;
            document.title = dictionary.pageTitle;

            document.querySelectorAll("[data-i18n]").forEach(element => {
                element.textContent = dictionary[element.dataset.i18n] || "";
            });

            document.querySelectorAll("[data-i18n-aria]").forEach(element => {
                element.setAttribute("aria-label", dictionary[element.dataset.i18nAria] || "");
            });

            document.querySelectorAll("[data-i18n-title]").forEach(element => {
                element.setAttribute("title", dictionary[element.dataset.i18nTitle] || "");
            });

            const toggle = document.getElementById("locale-toggle");
            if (toggle) {
                toggle.textContent = dictionary.languageToggleText;
                toggle.setAttribute("aria-label", dictionary.languageToggle);
                toggle.setAttribute("title", dictionary.languageToggle);
            }
        }

        document.getElementById("locale-toggle")?.addEventListener("click", () => {
            const nextLocale = activeLocale() === "zh-CN" ? "en" : "zh-CN";
            localStorage.setItem(localeStorageKey, nextLocale);
            localStorage.setItem("lessonGuideUiLocale", nextLocale);
            localStorage.setItem("lessonGuideTranslationLocale", nextLocale);
            applyLocale(nextLocale);
        });

        window.addEventListener("storage", event => {
            if (event.key === localeStorageKey) applyLocale(activeLocale());
        });

        applyLocale(activeLocale());
    </script>
</body>
</html>
