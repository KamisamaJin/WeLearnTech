<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KIIP Gramma Wiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="shared/styles/tokens.css" rel="stylesheet">
    <link href="shared/styles/components.css" rel="stylesheet">
    <link href="grammar/wiki.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-header-top">
                <div class="sidebar-heading">
                    <button class="lesson-return-button kiip-icon-button" type="button" data-lesson-return hidden aria-label="返回本课课程导学"></button>
                    <h1 class="sidebar-title">KIIP Gramma Wiki</h1>
                </div>
                <div class="language-switcher desktop-language-switcher" data-language-switcher data-language-variant="desktop"></div>
            </div>
            <a class="guide-link" href="lesson_guide.html" data-guide-link aria-label="打开课程导学首页">
                <span class="guide-badge">KIIP</span>
                <span class="guide-copy">
                    <strong data-guide-title>课程导学首页</strong>
                    <small data-guide-subtitle>Level 1-4 · 单词 · 对话 · 文化</small>
                </span>
                <span class="guide-arrow">→</span>
            </a>
            <input type="text" id="search" class="search-box" placeholder="Search grammar...">
        </div>
        <div class="level-filters" id="level-filters">
            <button class="level-filter-btn active" data-level="all">全部</button>
            <button class="level-filter-btn" data-level="L1">L1 初级1</button>
            <button class="level-filter-btn" data-level="L2">L2 初级2</button>
            <button class="level-filter-btn" data-level="L3">L3 中级1</button>
            <button class="level-filter-btn" data-level="L4">L4 中级2</button>
        </div>
        <ul class="nav-list" id="nav-list">
            <!-- Populated via JS -->
        </ul>
    </div>
    
    <div class="content-wrapper">
        <div class="mobile-header" id="mobile-header">
            <button class="lesson-return-button kiip-icon-button" type="button" data-lesson-return hidden aria-label="返回本课课程导学"></button>
            <div class="mobile-header-title">
                <span class="mobile-title-brand">KIIP Gramma Wiki</span>
                <span class="mobile-title-detail">
                    <span class="badge-level" id="mobile-detail-level"></span>
                    <span class="mobile-detail-text" id="mobile-detail-text"></span>
                </span>
            </div>
            <a class="mobile-guide-link kiip-icon-button" href="lesson_guide.html" data-guide-link title="课程导学首页" aria-label="打开课程导学首页"></a>
            <div class="language-switcher mobile-language-switcher" data-language-switcher></div>
            <button class="menu-toggle kiip-icon-button" id="menu-toggle" type="button" aria-expanded="false" aria-label="打开语法菜单">☰</button>
        </div>
        <div class="main-content" id="main-content">
            <div class="empty-state">
                <h2 data-empty-title>KIIP Gramma Wiki</h2>
                <p data-empty-body>从菜单选择一个语法点开始学习。</p>
            </div>
        </div>
        <!-- Floating prev/next navigation -->
        <div class="nav-float-btns" id="nav-float-btns">
            <button class="nav-float-btn" id="btn-prev" type="button">
                <span class="btn-icon">←</span>
                <span class="btn-label" id="prev-label">Prev</span>
            </button>
            <button class="nav-float-btn" id="btn-next" type="button">
                <span class="btn-label" id="next-label">Next</span>
                <span class="btn-icon">→</span>
            </button>
        </div>
    </div>

    <script src="grammar/bootstrap.js"></script>
</body>
</html>
