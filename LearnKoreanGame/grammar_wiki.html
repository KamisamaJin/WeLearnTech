<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Lingo Grammar Wiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent: #f472b6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .search-box {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--primary);
        }
        .nav-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            margin: 0;
            list-style: none;
        }
        .nav-category {
            padding: 10px 20px;
            font-weight: 800;
            color: var(--secondary);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .nav-item {
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-left-color: var(--primary);
        }
        .nav-item.active {
            background: rgba(56, 189, 248, 0.1);
            border-left-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }
        .nav-level {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
            min-width: 24px;
            text-align: center;
        }
        .nav-level.l1 { background: rgba(52,211,153,0.2); color: #34d399; }
        .nav-level.l2 { background: rgba(56,189,248,0.2); color: #38bdf8; }
        .nav-level.l3 { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .nav-level.l4 { background: rgba(244,114,182,0.2); color: #f472b6; }
        .nav-title { flex: 1; }
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05), transparent 50%);
        }
        .grammar-header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }
        .title-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .grammar-title {
            font-size: 2.5rem;
            margin: 0;
            color: #fff;
        }
        .badge-level {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .badge-level.l1 { background: rgba(52,211,153,0.2); color: #34d399; }
        .badge-level.l2 { background: rgba(56,189,248,0.2); color: #38bdf8; }
        .badge-level.l3 { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .badge-level.l4 { background: rgba(244,114,182,0.2); color: #f472b6; }
        .grammar-section {
            margin-bottom: 30px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .grammar-section h3 {
            margin-top: 0;
            color: var(--secondary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            align-items: baseline;
        }
        .header-zh {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-left: 8px;
            font-weight: 500;
        }
        .examples-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }
        .example-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 18px;
            border-radius: 6px;
            border-left: 3px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ex-ko { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0; }
        .ex-en { color: var(--text-muted); margin: 0; font-size: 0.95rem; }
        .ex-zh { color: var(--text-muted); margin: 0; font-size: 0.85rem; }
        .level-filters {
            display: flex;
            gap: 6px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .level-filter-btn {
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .level-filter-btn:hover { border-color: var(--primary); color: var(--text-main); }
        .level-filter-btn.active { border-color: transparent; color: #fff; }
        .level-filter-btn.active[data-level='all'] { background: var(--secondary); }
        .level-filter-btn.active[data-level='L1'] { background: rgba(52,211,153,0.5); color: #fff; }
        .level-filter-btn.active[data-level='L2'] { background: rgba(56,189,248,0.5); color: #fff; }
        .level-filter-btn.active[data-level='L3'] { background: rgba(251,191,36,0.5); color: #fff; }
        .level-filter-btn.active[data-level='L4'] { background: rgba(244,114,182,0.5); color: #fff; }
        .meaning-box {
            margin-bottom: 25px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .meaning-en {
            font-size: 1.15rem;
            color: #fff;
            font-weight: 500;
        }
        .meaning-zh {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .rules-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .rule-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 18px;
            border-radius: 6px;
            border-left: 3px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .rule-en { font-size: 1.05rem; font-weight: 700; color: #fff; font-family: 'Outfit', 'Noto Sans KR', sans-serif; }
        .rule-zh { font-size: 0.85rem; color: var(--text-muted); font-family: 'Outfit', 'Noto Sans KR', sans-serif; }
        .note-line {
            margin: 0 0 12px 0;
            line-height: 1.6;
        }
        .note-en {
            font-size: 0.95rem;
            color: #e2e8f0;
        }
        .note-zh {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .note-line:last-child { margin-bottom: 0; }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }
        .empty-state h2 { color: var(--primary); }

        /* Mobile Responsive */
        .mobile-header {
            display: none;
            padding: 15px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .mobile-header h1 { margin: 0; font-size: 1.2rem; color: var(--primary); flex: 1; }
        .menu-toggle {
            background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0;
        }
        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05), transparent 50%);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            backdrop-filter: blur(3px);
        }
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                width: 280px;
                z-index: 200;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .main-content { padding: 20px; background: transparent; }
            .sidebar-header h1 { display: none; }
            .sidebar-header { padding-top: 25px; }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>Grammar Wiki</h1>
            <input type="text" id="search" class="search-box" placeholder="Search grammar...">
        </div>
        <div class="level-filters" id="level-filters">
            <button class="level-filter-btn active" data-level="all" onclick="setLevelFilter('all')">All</button>
            <button class="level-filter-btn" data-level="L1" onclick="setLevelFilter('L1')">L1 초급1</button>
            <button class="level-filter-btn" data-level="L2" onclick="setLevelFilter('L2')">L2 초급2</button>
            <button class="level-filter-btn" data-level="L3" onclick="setLevelFilter('L3')">L3 중급1</button>
            <button class="level-filter-btn" data-level="L4" onclick="setLevelFilter('L4')">L4 중급2</button>
        </div>
        <ul class="nav-list" id="nav-list">
            <!-- Populated via JS -->
        </ul>
    </div>
    
    <div class="content-wrapper">
        <div class="mobile-header">
            <h1>K-Lingo Grammar Wiki</h1>
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        </div>
        <div class="main-content" id="main-content">
            <div class="empty-state">
                <h2>K-Lingo Grammar Encyclopedia</h2>
                <p>Select a grammar point from the menu to deep dive.</p>
            </div>
        </div>
    </div>

    <script src="grammar_data.js"></script>
    <script>
        const navList = document.getElementById('nav-list');
        const mainContent = document.getElementById('main-content');
        const searchInput = document.getElementById('search');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        let currentLevel = 'all';

        function toggleMenu() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('open');
        }

        function setLevelFilter(level) {
            currentLevel = level;
            document.querySelectorAll('.level-filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.level-filter-btn[data-level="${level}"]`).classList.add('active');
            renderNav(searchInput.value);
        }

        function renderNav(query = '') {
            navList.innerHTML = '';
            const q = query.toLowerCase();
            const categories = {};
            grammarDB.forEach(item => {
                if (currentLevel !== 'all' && item.level !== currentLevel) return;
                if (!categories[item.category]) categories[item.category] = [];
                categories[item.category].push(item);
            });

            for (const [cat, items] of Object.entries(categories)) {
                const filtered = items.filter(i => 
                    i.title.toLowerCase().includes(q) || 
                    i.desc.toLowerCase().includes(q) ||
                    i.meaning_zh.includes(query) ||
                    i.meaning_en.toLowerCase().includes(q)
                );
                if (filtered.length > 0) {
                    const catEl = document.createElement('li');
                    catEl.className = 'nav-category';
                    catEl.textContent = cat;
                    navList.appendChild(catEl);
                    filtered.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'nav-item';
                        const lvSpan = document.createElement('span');
                        lvSpan.className = 'nav-level ' + item.level.toLowerCase();
                        lvSpan.textContent = item.level;
                        const titleSpan = document.createElement('span');
                        titleSpan.className = 'nav-title';
                        titleSpan.textContent = item.title;
                        li.appendChild(lvSpan);
                        li.appendChild(titleSpan);
                        li.onclick = () => {
                            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                            li.classList.add('active');
                            renderContent(item);
                            if (window.innerWidth <= 768) {
                                toggleMenu(); // auto-close on mobile
                            }
                        };
                        navList.appendChild(li);
                    });
                }
            }
        }

        function renderContent(item) {
            let examplesHtml = item.examples.map(ex => `
                <div class="example-box">
                    <p class="ex-ko">${ex.ko}</p>
                    <p class="ex-en">${ex.en}</p>
                    <p class="ex-zh">${ex.zh}</p>
                </div>
            `).join('');

            let rulesHtml = item.rules.map(r => {
                if (typeof r === 'object' && r.zh) {
                    return `<div class="rule-card"><span class="rule-en">${r.en}</span><span class="rule-zh">${r.zh}</span></div>`;
                }
                return `<div class="rule-card"><span class="rule-en">${r}</span></div>`;
            }).join('');

            let notesHtml = '';
            if (item.notes) {
                let blocks = item.notes.split('\n\n');
                let enBlock = blocks.find(b => b.includes('💡'));
                let zhBlock = blocks.find(b => b.includes('⚠'));
                
                let orderedBlocks = [];
                if (enBlock) orderedBlocks.push(enBlock);
                if (zhBlock) orderedBlocks.push(zhBlock);
                
                notesHtml = orderedBlocks.map(block => {
                    let lines = block.split('\n');
                    let isEn = block.includes('💡');
                    let cls = isEn ? 'note-en' : 'note-zh';
                    
                    let html = '';
                    let inList = false;
                    
                    lines.forEach(line => {
                        let trimmed = line.trim();
                        if (trimmed.startsWith('•') || trimmed.startsWith('-')) {
                            if (!inList) {
                                html += `<ul class="${cls}" style="margin-top: 5px; margin-bottom: 15px; padding-left: 25px;">`;
                                inList = true;
                            }
                            html += `<li style="margin-bottom: 8px; line-height: 1.6;">${trimmed.substring(1).trim()}</li>`;
                        } else {
                            if (inList) {
                                html += `</ul>`;
                                inList = false;
                            }
                            html += `<p class="${cls}" style="margin-bottom: 10px; font-weight: bold; font-size: 1.05rem;">${trimmed}</p>`;
                        }
                    });
                    
                    if (inList) html += `</ul>`;
                    
                    return html;
                }).join('');
            }

            mainContent.innerHTML = `
                <div class="grammar-header">
                    <div class="title-row">
                        <span class="badge-level ${item.level.toLowerCase()}">${item.level}</span>
                        <h2 class="grammar-title">${item.title}</h2>
                    </div>
                    <p style="font-size: 1.2rem; color: #cbd5e1; margin-top: 5px;">${item.desc} ${item.desc_zh ? `<span style="font-size: 1rem; color: rgba(203, 213, 225, 0.6); margin-left: 8px;">(${item.desc_zh})</span>` : ''}</p>
                </div>
                
                <div class="grammar-section">
                    <h3>Meaning & Rules <span class="header-zh">(含义与结合规则)</span></h3>
                    <div class="meaning-box">
                        <span class="meaning-en">${item.meaning_en}</span>
                        <span class="meaning-zh">${item.meaning_zh}</span>
                    </div>

                    <div class="rules-container">
                        ${rulesHtml}
                    </div>
                </div>

                <div class="grammar-section">
                    <h3>Examples <span class="header-zh">(例句)</span></h3>
                    <div class="examples-container">
                        ${examplesHtml}
                    </div>
                </div>
                
                ${item.notes ? `
                <div class="grammar-section" style="border-color: var(--accent);">
                    <h3 style="color: var(--accent);">Deep Dive Notes <span class="header-zh" style="color: rgba(244,114,182,0.7);">(深入解析)</span></h3>
                    ${notesHtml}
                </div>
                ` : ''}
            `;
        }

        searchInput.addEventListener('input', (e) => renderNav(e.target.value));
        renderNav();

        // Mobile swipe gesture logic
        let touchStartX = 0;
        let touchEndX = 0;
        let touchStartY = 0;
        let touchEndY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const threshold = 50; // minimum swipe distance
            const isMobile = window.innerWidth <= 768;
            
            if (!isMobile) return;

            // Only trigger if horizontal movement is significantly greater than vertical movement
            // This prevents vertical scrolling from accidentally triggering the sidebar
            if (Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
                // Swipe right to open menu
                if (deltaX > threshold) {
                    if (!sidebar.classList.contains('open')) toggleMenu();
                } 
                // Swipe left to close menu
                else if (deltaX < -threshold) {
                    if (sidebar.classList.contains('open')) toggleMenu();
                }
            }
        }
    </script>
</body>
</html>
