<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K-Lingo Grammar Wiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent: #f472b6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;       /* fallback for older browsers */
            height: 100dvh;      /* dvh = real visible height, adjusts when browser toolbar shows/hides */
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .sidebar-header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .language-switcher {
            position: relative;
            flex-shrink: 0;
        }
        .language-toggle {
            min-width: 86px;
            height: 36px;
            padding: 0 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 7px;
            background: rgba(15, 23, 42, 0.72);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font: 700 0.8rem/1 inherit;
            cursor: pointer;
        }
        .language-toggle:hover,
        .language-toggle[aria-expanded="true"] {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.12);
        }
        .language-toggle svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
        }
        .language-menu {
            position: absolute;
            top: calc(100% + 7px);
            right: 0;
            z-index: 300;
            width: 160px;
            padding: 7px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 8px;
            background: #111827;
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.42);
        }
        .language-menu[hidden] { display: none; }
        .language-menu p {
            margin: 3px 7px 7px;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 700;
        }
        .language-option {
            width: 100%;
            padding: 8px 10px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--text-main);
            text-align: left;
            font: 700 0.86rem/1.2 inherit;
            cursor: pointer;
        }
        .language-option:hover { background: rgba(255, 255, 255, 0.07); }
        .language-option.active {
            background: rgba(56, 189, 248, 0.16);
            color: var(--primary);
        }
        .guide-link {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 14px;
            padding: 10px 11px;
            border: 1px solid rgba(56, 189, 248, 0.24);
            border-radius: 10px;
            background:
                linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(129, 140, 248, 0.08)),
                rgba(15, 23, 42, 0.28);
            color: var(--text-main);
            text-decoration: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .guide-link:hover {
            color: var(--text-main);
            border-color: rgba(56, 189, 248, 0.55);
            background:
                linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.12)),
                rgba(15, 23, 42, 0.42);
            box-shadow: 0 10px 24px rgba(56, 189, 248, 0.12), inset 0 1px 0 rgba(255,255,255,0.08);
            transform: translateY(-1px);
        }
        .guide-link:active {
            transform: translateY(0);
        }
        .guide-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border: 1px solid rgba(56, 189, 248, 0.32);
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.16);
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 900;
        }
        .guide-copy {
            display: grid;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .guide-copy strong {
            color: #fff;
            font-size: 0.9rem;
            line-height: 1.2;
        }
        .guide-copy small {
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .guide-arrow {
            flex-shrink: 0;
            color: var(--primary);
            font-weight: 900;
            transition: transform 0.2s ease;
        }
        .guide-link:hover .guide-arrow {
            transform: translateX(2px);
        }
        .search-box {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--primary);
        }
        .nav-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            margin: 0;
            list-style: none;
        }
        .nav-empty {
            padding: 24px 20px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .nav-category {
            padding: 10px 20px;
            font-weight: 800;
            color: var(--secondary);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .nav-item {
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-left-color: var(--primary);
        }
        .nav-item.active {
            background: rgba(56, 189, 248, 0.1);
            border-left-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }
        .nav-level {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
            min-width: 24px;
            text-align: center;
        }
        .nav-level.l1 { background: rgba(52,211,153,0.2); color: #34d399; }
        .nav-level.l2 { background: rgba(56,189,248,0.2); color: #38bdf8; }
        .nav-level.l3 { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .nav-level.l4 { background: rgba(244,114,182,0.2); color: #f472b6; }
        .nav-title { flex: 1; }
        .main-content {
            flex: 1;
            padding: 20px 24px;
            padding-bottom: max(80px, calc(20px + env(safe-area-inset-bottom)));
            overflow-y: auto;
            background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05), transparent 50%);
        }
        .grammar-header {
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        .title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .grammar-title {
            font-size: 1.4rem;
            margin: 0;
            color: #fff;
        }
        .badge-level {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-level.l1 { background: rgba(52,211,153,0.2); color: #34d399; }
        .badge-level.l2 { background: rgba(56,189,248,0.2); color: #38bdf8; }
        .badge-level.l3 { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .badge-level.l4 { background: rgba(244,114,182,0.2); color: #f472b6; }
        .grammar-section {
            margin-bottom: 14px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .grammar-section h3 {
            margin-top: 0;
            color: var(--secondary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            align-items: baseline;
        }
        .grammar-description,
        .localized-meaning {
            color: var(--text-muted);
            line-height: 1.65;
        }
        .grammar-description { margin: 7px 0 0; }
        .localized-meaning { margin: 0 0 14px; }
        .examples-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }
        .example-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 18px;
            border-radius: 6px;
            border-left: 3px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ex-ko { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0; }
        .ex-translation { color: var(--text-muted); margin: 0; font-size: 0.95rem; line-height: 1.5; }
        .level-filters {
            display: flex;
            gap: 6px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .level-filter-btn {
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .level-filter-btn:hover { border-color: var(--primary); color: var(--text-main); }
        .level-filter-btn.active { border-color: transparent; color: #fff; }
        .level-filter-btn.active[data-level='all'] { background: var(--secondary); }
        .level-filter-btn.active[data-level='L1'] { background: rgba(52,211,153,0.5); color: #fff; }
        .level-filter-btn.active[data-level='L2'] { background: rgba(56,189,248,0.5); color: #fff; }
        .level-filter-btn.active[data-level='L3'] { background: rgba(251,191,36,0.5); color: #fff; }
        .level-filter-btn.active[data-level='L4'] { background: rgba(244,114,182,0.5); color: #fff; }
        .rules-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .rule-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 18px;
            border-radius: 6px;
            border-left: 3px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .localized-rule { font-size: 1rem; font-weight: 700; color: #fff; line-height: 1.5; }
        .notes-list {
            margin: 0;
            padding-left: 1.25rem;
            color: #e2e8f0;
            line-height: 1.7;
        }
        .notes-list li + li { margin-top: 8px; }
        .deep-dive-section { border-color: rgba(244, 114, 182, 0.42); }
        .deep-dive-section h3 { color: var(--accent); }
        .knowledge-section { border-color: rgba(52, 211, 153, 0.36); }
        .knowledge-section h3 { color: #34d399; }
        .knowledge-list { display: grid; gap: 16px; }
        .knowledge-topic {
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .knowledge-topic:last-child {
            padding-bottom: 0;
            border-bottom: 0;
        }
        .knowledge-topic h4 {
            margin: 0 0 7px;
            color: #fff;
            font-size: 1rem;
        }
        .knowledge-topic p {
            margin: 0;
            color: var(--text-muted);
            line-height: 1.65;
        }
        .related-links {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 11px;
        }
        .related-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 34px;
            padding: 6px 10px;
            border: 1px solid rgba(52, 211, 153, 0.28);
            border-radius: 6px;
            background: rgba(52, 211, 153, 0.08);
            color: var(--text-main);
            font: 700 0.82rem/1.2 inherit;
            cursor: pointer;
        }
        .related-link:hover {
            border-color: #34d399;
            background: rgba(52, 211, 153, 0.15);
        }
        .related-link .nav-level { font-size: 0.64rem; }
        /* Floating prev/next nav buttons */
        .nav-float-btns {
            position: fixed;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            right: 20px;
            display: none;
            gap: 8px;
            z-index: 100;
            align-items: center;
        }
        .nav-float-btns.visible { display: flex; }
        .nav-float-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: rgba(248, 250, 252, 0.75);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            letter-spacing: 0.3px;
            outline: none;
        }
        .nav-float-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(56, 189, 248, 0.15);
        }
        .nav-float-btn:active { transform: translateY(0); }
        .nav-float-btn:focus { outline: none; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .nav-float-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .nav-float-btn .btn-icon { font-size: 1rem; }
        .nav-float-btn .btn-label { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }
        .empty-state h2 { color: var(--primary); }

        /* Mobile Responsive */
        .mobile-header {
            display: none;
            padding: 15px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .mobile-header-title {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mobile-title-brand {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mobile-title-detail {
            display: none;
            min-width: 0;
            align-items: center;
            gap: 8px;
        }
        .mobile-header.show-detail-title .mobile-title-brand { display: none; }
        .mobile-header.show-detail-title .mobile-title-detail { display: flex; }
        .mobile-detail-text {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }
        .mobile-guide-link {
            width: 36px;
            height: 36px;
            padding: 0;
            margin-right: 10px;
            box-sizing: border-box;
            border-radius: 9px;
            border: 1px solid rgba(56, 189, 248, 0.28);
            background: rgba(56, 189, 248, 0.12);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            text-decoration: none;
            font-weight: 900;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .mobile-guide-link svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .mobile-guide-link:hover {
            border-color: rgba(56, 189, 248, 0.55);
            background: rgba(56, 189, 248, 0.18);
        }
        .mobile-language-switcher { margin-right: 8px; }
        .mobile-language-switcher .language-toggle {
            width: 44px;
            min-width: 44px;
            padding: 0 5px;
            gap: 4px;
        }
        .mobile-language-switcher .language-toggle svg {
            width: 15px;
            height: 15px;
        }
        .menu-toggle {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0;
        }
        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05), transparent 50%);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            backdrop-filter: blur(3px);
        }
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                width: 280px;
                z-index: 200;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .main-content { padding: 20px; background: transparent; }
            .sidebar-header h1 { display: none; }
            .sidebar-header { padding-top: 25px; }
        }
        @media (max-width: 420px) {
            .mobile-header { padding: 12px 14px; }
            .mobile-title-brand { font-size: 1.05rem; }
            .mobile-guide-link { margin-right: 6px; }
            .mobile-language-switcher { margin-right: 4px; }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-header-top">
                <h1 class="sidebar-title">语法百科</h1>
                <div class="language-switcher" data-language-switcher data-language-variant="desktop"></div>
            </div>
            <a class="guide-link" href="lesson_guide.html" data-guide-link aria-label="打开课程导学首页">
                <span class="guide-badge">KIIP</span>
                <span class="guide-copy">
                    <strong data-guide-title>课程导学首页</strong>
                    <small data-guide-subtitle>Level 1-4 · 单词 · 对话 · 文化</small>
                </span>
                <span class="guide-arrow">→</span>
            </a>
            <input type="text" id="search" class="search-box" placeholder="Search grammar...">
        </div>
        <div class="level-filters" id="level-filters">
            <button class="level-filter-btn active" data-level="all">全部</button>
            <button class="level-filter-btn" data-level="L1">L1 初级1</button>
            <button class="level-filter-btn" data-level="L2">L2 初级2</button>
            <button class="level-filter-btn" data-level="L3">L3 中级1</button>
            <button class="level-filter-btn" data-level="L4">L4 中级2</button>
        </div>
        <ul class="nav-list" id="nav-list">
            <!-- Populated via JS -->
        </ul>
    </div>
    
    <div class="content-wrapper">
        <div class="mobile-header" id="mobile-header">
            <div class="mobile-header-title">
                <span class="mobile-title-brand">K-Lingo Grammar Wiki</span>
                <span class="mobile-title-detail">
                    <span class="badge-level" id="mobile-detail-level"></span>
                    <span class="mobile-detail-text" id="mobile-detail-text"></span>
                </span>
            </div>
            <a class="mobile-guide-link" href="lesson_guide.html" data-guide-link title="课程导学首页" aria-label="打开课程导学首页">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 7v14"></path>
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H12V5H6.5A2.5 2.5 0 0 0 4 7.5v12Z"></path>
                    <path d="M20 19.5A2.5 2.5 0 0 0 17.5 17H12V5h5.5A2.5 2.5 0 0 1 20 7.5v12Z"></path>
                </svg>
            </a>
            <div class="language-switcher mobile-language-switcher" data-language-switcher></div>
            <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-label="打开语法菜单">☰</button>
        </div>
        <div class="main-content" id="main-content">
            <div class="empty-state">
                <h2 data-empty-title>K-Lingo 韩语语法百科</h2>
                <p data-empty-body>从菜单选择一个语法点开始学习。</p>
            </div>
        </div>
        <!-- Floating prev/next navigation -->
        <div class="nav-float-btns" id="nav-float-btns">
            <button class="nav-float-btn" id="btn-prev" type="button">
                <span class="btn-icon">←</span>
                <span class="btn-label" id="prev-label">Prev</span>
            </button>
            <button class="nav-float-btn" id="btn-next" type="button">
                <span class="btn-label" id="next-label">Next</span>
                <span class="btn-icon">→</span>
