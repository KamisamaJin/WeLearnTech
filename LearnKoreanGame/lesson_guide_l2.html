<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KIIP L2 Lesson Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121417;
            --panel: rgba(28, 32, 38, 0.78);
            --panel-solid: #1c2026;
            --line: rgba(255,255,255,0.1);
            --text: #f7f4ee;
            --muted: #a7adb7;
            --soft: #cdd3dd;
            --teal: #2dd4bf;
            --amber: #fbbf24;
            --rose: #fb7185;
            --violet: #a78bfa;
            --green: #4ade80;
            --shadow: rgba(0,0,0,0.24);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(circle at 90% 6%, rgba(45, 212, 191, 0.12), transparent 32%),
                radial-gradient(circle at 18% 92%, rgba(251, 191, 36, 0.11), transparent 34%),
                var(--bg);
            color: var(--text);
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
        }

        button, input {
            font: inherit;
        }

        .app-shell {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 318px;
            flex: 0 0 318px;
            display: flex;
            flex-direction: column;
            background: rgba(21, 24, 29, 0.9);
            border-right: 1px solid var(--line);
            backdrop-filter: blur(14px);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--line);
        }

        .sidebar-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .sidebar-title {
            margin: 0;
            font-size: 1.35rem;
            line-height: 1.15;
            color: var(--teal);
        }

        .sidebar-subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .search-box {
            width: 100%;
            margin-top: 14px;
            padding: 11px 12px;
            color: var(--text);
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
        }

        .search-box:focus {
            border-color: rgba(45, 212, 191, 0.75);
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.12);
        }

        .lesson-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .lesson-item {
            width: 100%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 11px 10px;
            margin-bottom: 5px;
            color: var(--soft);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
        }

        .lesson-item:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.08);
        }

        .lesson-item.active {
            color: var(--text);
            background: rgba(45, 212, 191, 0.12);
            border-color: rgba(45, 212, 191, 0.4);
        }

        .lesson-number {
            min-width: 34px;
            padding: 5px 0;
            color: #071312;
            background: var(--teal);
            border-radius: 7px;
            text-align: center;
            font-size: 0.74rem;
            font-weight: 900;
        }

        .lesson-item.todo .lesson-number {
            color: var(--muted);
            background: rgba(255,255,255,0.08);
        }

        .lesson-name {
            min-width: 0;
        }

        .lesson-ko {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 800;
        }

        .lesson-zh {
            margin-top: 2px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .status-pill {
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-draft {
            color: #171008;
            background: var(--amber);
        }

        .status-refined {
            color: #071312;
            background: var(--teal);
        }

        .status-todo {
            color: var(--muted);
            background: rgba(255,255,255,0.08);
        }

        .content-shell {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mobile-header {
            position: relative;
            z-index: 120;
            display: none;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(21, 24, 29, 0.92);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(14px);
        }

        .menu-toggle {
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            background: rgba(255,255,255,0.05);
            cursor: pointer;
        }

        .mobile-title {
            flex: 1;
            min-width: 0;
            font-weight: 900;
            color: var(--teal);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .language-switcher {
            position: relative;
            z-index: 130;
            flex: 0 0 auto;
        }

        .language-toggle {
            display: inline-grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            background: rgba(255,255,255,0.05);
            cursor: pointer;
        }

        .language-toggle svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .language-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            z-index: 140;
            width: 236px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(28, 32, 38, 0.98);
            box-shadow: 0 18px 44px var(--shadow);
            backdrop-filter: blur(14px);
        }

        .language-menu[hidden] {
            display: none;
        }

        .language-section + .language-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
        }

        .language-section-title {
            margin: 0 0 7px;
            color: var(--muted);
            font-size: 0.74rem;
            font-weight: 900;
        }

        .language-option {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 9px;
            border: 1px solid transparent;
            border-radius: 7px;
            color: var(--soft);
            background: transparent;
            cursor: pointer;
            text-align: left;
            font-weight: 800;
        }

        .language-option:hover,
        .language-option.active {
            color: var(--text);
            background: rgba(45, 212, 191, 0.1);
            border-color: rgba(45, 212, 191, 0.28);
        }

        .language-option.active::after {
            content: "✓";
            color: var(--teal);
            font-weight: 900;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 24px;
            touch-action: pan-y;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            align-items: start;
            padding: 24px 0 18px;
            border-bottom: 1px solid var(--line);
        }

        .eyebrow {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .level-badge,
        .page-badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 900;
        }

        .level-badge {
            color: #071312;
            background: var(--teal);
        }

        .page-badge {
            color: var(--soft);
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--line);
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.2rem);
            line-height: 1.05;
            letter-spacing: 0;
        }

        .hero-zh {
            margin: 8px 0 0;
            color: var(--soft);
            font-size: 1.05rem;
        }

        .tabs {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            gap: 8px;
            margin: 0 -24px 14px;
            padding: 10px 24px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(18, 20, 23, 0.97);
            box-shadow: 0 12px 26px rgba(0,0,0,0.22);
            backdrop-filter: blur(14px);
            overflow-x: auto;
            overscroll-behavior-x: contain;
            scroll-padding: 24px;
            scroll-snap-type: x proximity;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 0 0 auto;
            min-width: 74px;
            padding: 9px 13px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--muted);
            background: rgba(255,255,255,0.04);
            cursor: pointer;
            font-weight: 800;
            scroll-snap-align: start;
        }

        .tab-btn.active {
            color: #071312;
            border-color: transparent;
            background: var(--teal);
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .stat-card,
        .content-card,
        .word-card,
        .line-card,
        .practice-card {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 12px 28px var(--shadow);
        }

        .stat-card {
            appearance: none;
            width: 100%;
            padding: 15px;
            color: inherit;
            text-align: left;
            font: inherit;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }

        .stat-card:hover {
            border-color: rgba(41, 217, 194, 0.42);
            background: rgba(41, 217, 194, 0.07);
            box-shadow: 0 14px 30px rgba(41, 217, 194, 0.08);
            transform: translateY(-1px);
        }

        .stat-card:active {
            transform: translateY(0);
        }

        .stat-card:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 2px;
        }

        .stat-value {
            color: var(--teal);
            font-size: 1.8rem;
            font-weight: 900;
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .content-card {
            padding: 18px;
            margin-bottom: 14px;
        }

        .content-card h2,
        .content-card h3 {
            margin: 0 0 12px;
        }

        .muted {
            color: var(--muted);
        }

        .guide-list {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .guide-list li {
            padding: 10px 12px;
            border-left: 3px solid var(--teal);
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            line-height: 1.55;
        }

        .grammar-row,
        .term-row,
        .qa-row {
            display: grid;
            gap: 8px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
        }

        .grammar-row + .grammar-row,
        .term-row + .term-row,
        .qa-row + .qa-row {
            margin-top: 8px;
        }

        .pattern {
            color: var(--amber);
            font-weight: 900;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .tool-btn {
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            background: rgba(255,255,255,0.06);
            cursor: pointer;
            font-weight: 800;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        .word-card {
            position: relative;
            padding: 15px 15px 56px;
        }

        .word-top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 30px;
            align-items: center;
            gap: 10px;
        }

        .word-title-line {
            display: flex;
            align-items: baseline;
            gap: 6px 10px;
            flex-wrap: wrap;
            min-width: 0;
        }

        .word-ko {
            color: var(--text);
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            line-height: 1.3;
        }

        .word-pron {
            color: var(--muted);
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
            line-height: 1.3;
            max-width: 100%;
            overflow-wrap: anywhere;
            word-break: keep-all;
        }

        .speak-btn {
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border: 1px solid rgba(41, 217, 194, 0.34);
            border-radius: 8px;
            color: var(--teal);
            background: rgba(41, 217, 194, 0.1);
            cursor: pointer;
            flex: 0 0 auto;
        }

        .speak-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .speak-btn:active {
            transform: translateY(1px);
        }

        .speak-btn.speaking {
            color: #071312;
            background: var(--teal);
            border-color: var(--teal);
        }

        .word-pos {
            padding: 4px 6px;
            color: var(--muted);
            background: rgba(255,255,255,0.07);
            border-radius: 6px;
            font-size: 0.72rem;
            white-space: nowrap;
        }

        .word-meta {
            position: absolute;
            right: 14px;
            bottom: 14px;
            left: 14px;
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 6px;
        }

        .word-source {
            padding: 4px 6px;
            color: #9ff4e9;
            background: rgba(41, 217, 194, 0.1);
            border: 1px solid rgba(41, 217, 194, 0.22);
            border-radius: 6px;
            font-size: 0.72rem;
            white-space: nowrap;
        }

        .word-zh {
            margin-top: 7px;
            color: var(--teal);
            font-weight: 800;
        }

        .word-guide,
        .example-zh,
        .line-guide {
            color: var(--muted);
            line-height: 1.55;
            font-size: 0.93rem;
        }

        .word-guide-tips {
            display: grid;
            gap: 5px;
            margin-top: 9px;
        }

        .word-guide-tip {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 8px;
            align-items: start;
            color: var(--muted);
            line-height: 1.4;
            font-size: 0.84rem;
        }

        .word-guide-label {
            width: fit-content;
            padding: 1px 5px;
            border: 1px solid rgba(41, 217, 194, 0.18);
            border-radius: 5px;
            color: var(--teal);
            background: rgba(41, 217, 194, 0.08);
            font-size: 0.66rem;
            font-weight: 900;
            line-height: 1.35;
            white-space: nowrap;
        }

        .word-guide-text {
            color: var(--soft);
        }

        .example-ko {
            margin-top: 12px;
            color: var(--soft);
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            line-height: 1.55;
        }

        .dialogue-card {
            padding: 0;
            overflow: hidden;
        }

        .dialogue-header {
            display: grid;
            gap: 10px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(255,255,255,0.025);
        }

        .dialogue-title {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }

        .dialogue-title h2 {
            margin: 0;
            line-height: 1.25;
        }

        .dialogue-meta,
        .speaker-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .dialogue-focus {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 4px 8px;
            border-radius: 6px;
            color: #211505;
            background: var(--amber);
            font-size: 0.72rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .speaker-chip {
            padding: 5px 7px;
            border-radius: 6px;
            color: #160b10;
            background: var(--rose);
            font-size: 0.75rem;
            font-weight: 900;
        }

        .dialogue-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.45fr) minmax(270px, 0.75fr);
            min-height: 0;
        }

        .dialogue-transcript {
            padding: 18px 20px 20px;
        }

        .dialogue-panel-title {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 900;
        }

        .dialogue-side {
            display: grid;
            align-content: start;
            gap: 12px;
            padding: 16px;
            border-left: 1px solid var(--line);
            background: rgba(0,0,0,0.12);
        }

        .dialogue-mini-panel {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
        }

        .dialogue-side details {
            margin-top: 0;
        }

        .dialogue-mini-panel h3 {
            margin: 0 0 8px;
            color: var(--teal);
            font-size: 0.95rem;
        }

        .dialogue-scene {
            margin: 0;
            max-width: 820px;
            color: var(--soft);
            line-height: 1.55;
        }

        .dialogue-points {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .dialogue-points li {
            color: var(--soft);
            line-height: 1.5;
        }

        .line-card {
            display: grid;
            grid-template-columns: 32px minmax(0, 1fr);
            gap: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,255,255,0.045);
        }

        .line-card:last-child {
            margin-bottom: 0;
        }

        .line-index {
            display: inline-grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #071312;
            background: var(--teal);
            font-size: 0.78rem;
            font-weight: 900;
        }

        .line-body {
            min-width: 0;
        }

        .line-speaker-row {
            margin-bottom: 5px;
        }

        .speaker {
            color: var(--rose);
            font-weight: 900;
        }

        .line-ko-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 30px;
            align-items: start;
            gap: 10px;
        }

        .line-ko {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.5;
        }

        .line-zh {
            margin-top: 5px;
            color: var(--teal);
            font-weight: 700;
            line-height: 1.5;
        }

        .line-guide {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        details {
            margin-top: 10px;
        }

        summary {
            color: var(--amber);
            cursor: pointer;
            font-weight: 800;
        }

        .drill {
            margin-top: 10px;
            padding: 11px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
        }

        .drill-answer {
            margin-top: 8px;
            color: var(--soft);
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.5;
        }

        .role-task-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .role-task {
            padding: 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
        }

        .role-task h3 {
            margin: 0 0 8px;
            color: var(--teal);
            font-size: 0.95rem;
        }

        .culture-summary {
            margin-bottom: 12px;
            padding: 14px;
            border: 1px solid rgba(45, 212, 191, 0.3);
            border-radius: 8px;
            color: #d5fbf5;
            background: rgba(45, 212, 191, 0.08);
            line-height: 1.65;
        }

        .paragraph-block {
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
        }

        .paragraph-block:last-child {
            border-bottom: none;
        }

        .paragraph-label {
            display: inline-flex;
            margin-bottom: 7px;
            padding: 3px 6px;
            border-radius: 6px;
            color: var(--muted);
            background: rgba(255,255,255,0.07);
            font-size: 0.72rem;
            font-weight: 900;
        }

        .paragraph-ko {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.08rem;
            font-weight: 800;
            line-height: 1.65;
        }

        .paragraph-zh {
            margin-top: 7px;
            color: var(--teal);
            line-height: 1.65;
        }

        .practice-card {
            padding: 16px;
            margin-bottom: 12px;
        }

        .practice-type {
            display: inline-flex;
            margin-bottom: 8px;
            padding: 4px 7px;
            color: #160b10;
            background: var(--rose);
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 900;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")

                return `${item.ko} means "${item.translations.en.meaning}". Notice how it is used in the example sentence.`;
            }

        function uniqueGuideTips(tips) {
            const seen = new Set();
            return tips.filter(tip => {
                if (!tip?.text) return false;
                const key = `${tip.type || tip.label}:${tip.text}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        const wordGuideTipTypeByLabel = {

            "易错": "pitfall",

                collocation: "Pattern",

                form: "Form"

        function wordGuideTipType(tip) {
            return tip?.type || wordGuideTipTypeByLabel[tip?.label] || "";
        }

        function wordGuideTipLabel(type) {
            return wordGuideTipLabels[uiLocale]?.[type] || wordGuideTipLabels["zh-CN"][type] || type;

        function normalizeWordGuideTips(tips = []) {
            if (!Array.isArray(tips)) return [];
            return uniqueGuideTips(tips
                .map(tip => ({
                    type: wordGuideTipType(tip),
                    text: String(tip.text || "").trim()
                }))
                .filter(tip => tip.type && tip.text)
                .map(tip => ({
                    type: tip.type,
                    text: tip.text

        }

        function lessonHasWordGuideTips(lesson) {
            return (lesson?.vocabulary || []).some(item => localizedWordGuideTips(item).length);

        function localizedWordGuideTips(item) {
            const preferred = item?.translations?.[translationLocale]?.tips;
            if (Array.isArray(preferred) && preferred.length) return normalizeWordGuideTips(preferred);
            if (translationLocale !== "zh-CN") return [];

            const fallbackTranslation = item?.translations?.["zh-CN"]?.tips;
            if (Array.isArray(fallbackTranslation) && fallbackTranslation.length) return normalizeWordGuideTips(fallbackTranslation);

            return normalizeWordGuideTips(item?.tips);

        function mergeLocaleFields(item, locale, fields) {
            if (!item || !fields) return;
            const cleaned = Object.fromEntries(Object.entries(fields).filter(([, value]) => value !== undefined));
            if (!Object.keys(cleaned).length) return;
            item.translations ||= {};
            item.translations[locale] = {

        function mergeArrayLocaleFields(items = [], locale, fieldPatches = []) {
            fieldPatches.forEach((fields, index) => {

        function applyLessonTranslationPatch(lesson, locale, patch) {
            if (!patch) return;

            mergeLocaleFields(lesson, locale, {
                title: patch.title,

            mergeArrayLocaleFields(lesson.grammar, locale, patch.grammar);

                const dialogue = lesson.dialogues?.[index];

        const boundNounTensingSyllables = new Set(["수", "게", "거", "걷", "곧"]);

        function decomposeHangul(char) {
            const code = char.charCodeAt(0);
            if (code < hangulBase || code > hangulLast) return null;
            const syllableIndex = code - hangulBase;
            const finalIndex = syllableIndex % 28;
            const medialIndex = Math.floor(syllableIndex / 28) % 21;
            const initialIndex = Math.floor(syllableIndex / 588);

            return {
                initial: hangulInitials[initialIndex],
                medial: hangulMedials[medialIndex],
                final: hangulFinals[finalIndex]
            };

        function composeHangul({ initial, medial, final = "" }) {
            const initialIndex = hangulInitialIndex[initial];
            const medialIndex = hangulMedials.indexOf(medial);
            const finalIndex = hangulFinalIndex[final] ?? 0;
            if (initialIndex === undefined || medialIndex < 0) return "";

            return String.fromCharCode(hangulBase + ((initialIndex * 21 + medialIndex) * 28) + finalIndex);

        function pronounceHangulRun(run) {

                const next = syllables[index + 1];

                if (current.final === "ㅎ" && aspiratedInitials[next.initial]) {
                    current.final = "";
                    next.initial = aspiratedInitials[next.initial];
                    continue;
                }

                if ((current.final === "ㄶ" || current.final === "ㅀ") && aspiratedInitials[next.initial]) {

                    next.initial = aspiratedInitials[next.initial];
                    continue;

                const nextChar = chars[index + 1];
                if (chars[index - 1] === "을" || chars[index - 1] === "를") continue;

        let speechRunId = 0;

        function scoreKoreanVoice(voice) {
            const name = voice.name.toLowerCase();
            const lang = voice.lang?.toLowerCase() || "";
            const femaleHints = ["sora", "yuna", "sunhi", "heami", "nara", "kyuri", "jimin", "ji-min", "female", "여성"];
            const naturalHints = ["natural", "neural", "premium", "enhanced", "online", "google", "microsoft"];
            const roboticHints = ["compact", "male", "hyunsu", "injoon", "hoon", "minjun", "남성"];
            const femaleScore = femaleHints.reduce((score, hint, index) => score + (name.includes(hint) ? 120 - index : 0), 0);
            const naturalScore = naturalHints.reduce((score, hint, index) => score + (name.includes(hint) ? 70 - index : 0), 0);
            const roboticPenalty = roboticHints.reduce((score, hint) => score + (name.includes(hint) ? 80 : 0), 0);
            const koKrScore = lang === "ko-kr" ? 30 : 0;
            return femaleScore + naturalScore + koKrScore - roboticPenalty;

        function pickKoreanVoice() {
            if (!("speechSynthesis" in window)) return null;
            const voices = window.speechSynthesis.getVoices?.() || [];
            const koreanVoices = voices.filter(voice => voice.lang?.toLowerCase().startsWith("ko"));
            if (!koreanVoices.length) return null;

            const rankedVoices = koreanVoices
                .map(voice => ({ voice, score: scoreKoreanVoice(voice) }))
                .sort((a, b) => b.score - a.score);
            preferredKoreanVoice = rankedVoices[0].score > 35
                ? rankedVoices[0].voice
                : koreanVoices[1] || rankedVoices[0].voice;
            return preferredKoreanVoice;
        }

        function waitForKoreanVoice() {
            if (!("speechSynthesis" in window)) return Promise.resolve(null);
            const readyVoice = preferredKoreanVoice || pickKoreanVoice();
            if (readyVoice) return Promise.resolve(readyVoice);
            if (koreanVoicePromise) return koreanVoicePromise;

            koreanVoicePromise = new Promise(resolve => {
                const finish = () => {
                    const voice = pickKoreanVoice();
                    if (!voice) return;
                    cleanup();
                    resolve(voice);
                };
                const cleanup = () => {
                    window.clearTimeout(timeoutId);
                    window.speechSynthesis.removeEventListener?.("voiceschanged", finish);
                };
                const timeoutId = window.setTimeout(() => {
                    cleanup();
                    resolve(pickKoreanVoice());
                }, 1600);

                window.speechSynthesis.addEventListener?.("voiceschanged", finish);
                window.speechSynthesis.getVoices?.();
            }).finally(() => {
                koreanVoicePromise = null;

            const normalized = String(text || "").replace(/\s+/g, " ").trim();
            if (!normalized || mode === "word" || normalized.length < 24) return [normalized].filter(Boolean);

            const protectedText = normalized.replace(/([.?!])\s+/g, "$1|");
            const chunks = protectedText.split("|").flatMap(part => {
                if (part.length < 30) return [part];
                return part
                    .replace(/(는데|은데|인데|지만|면서|으면|고)\s+/g, "$1|")
                    .split("|");
            });

            return chunks.map(chunk => chunk.trim()).filter(Boolean);
        }

        async function speakKorean(text, options = {}) {
            if (!("speechSynthesis" in window) || !text) return;

            const mode = options.mode || "word";
            const normalizedText = normalizeKoreanSpeechText(text);
            if (!hasHangul(normalizedText)) return;

            const runId = ++speechRunId;
            window.speechSynthesis.cancel();

            document.querySelectorAll(".speak-btn.speaking").forEach(button => button.classList.remove("speaking"));
            options.button?.classList.add("speaking");

            const voice = await waitForKoreanVoice();
            if (runId !== speechRunId) {
                options.button?.classList.remove("speaking");
                return;
            }
            if (!voice) {
                options.button?.classList.remove("speaking");
                return;
            }

            const chunks = splitKoreanSpeech(normalizedText, mode);

            const speakChunk = index => {
                if (runId !== speechRunId || index >= chunks.length) {
                    options.button?.classList.remove("speaking");
                    return;

                const utterance = new SpeechSynthesisUtterance(chunks[index]);
                utterance.lang = "ko-KR";
                utterance.rate = mode === "sentence" ? 0.78 : 0.82;
                utterance.pitch = mode === "sentence" ? 0.92 : 0.98;
                utterance.volume = 1;
                utterance.voice = voice;
                utterance.onend = () => window.setTimeout(() => speakChunk(index + 1), mode === "sentence" ? 90 : 0);
                utterance.onerror = () => options.button?.classList.remove("speaking");
                window.speechSynthesis.speak(utterance);
            };

            speakChunk(0);
        }

                script.src = absoluteSrc;

                script.onerror = () => reject(new Error(`课程数据加载失败：${absoluteSrc}`));

            if (!lessonTranslationLoadPromises.has(promiseKey)) {
                lessonTranslationLoadPromises.set(promiseKey, loadScript(src).catch(error => {

            await lessonTranslationLoadPromises.get(promiseKey);

        function lessonMatches(lesson, query) {
            if (!query) return true;
            const searchableLesson = lessonCache.get(lesson.id) || lesson;
            const haystack = [
                searchableLesson.titleKo,
                searchableLesson.titleZh,
                JSON.stringify(searchableLesson.translations || ""),
                searchableLesson.number,
                searchableLesson.searchText,
                ...(searchableLesson.goals || []),
                ...(searchableLesson.grammar || []).map(item => `${item.pattern} ${item.zh} ${item.guide}`),
                ...(searchableLesson.vocabulary || []).map(item => `${item.ko} ${item.zh} ${item.guide}`),
                ...(searchableLesson.dialogues || []).flatMap(dialogue => [
                    dialogue.title,
                    dialogue.focus,
                    dialogue.source,
                    dialogue.sceneZh,
                    ...(dialogue.learningPoints || []),
                    ...(dialogue.lines || []).map(line => `${line.ko} ${line.zh} ${line.guide}`),
                    ...(dialogue.rolePlays || []).map(item => `${item.title} ${item.promptZh} ${item.answerKo}`),
                    ...(dialogue.drills || []).map(item => `${item.promptZh} ${item.answerKo} ${item.pattern}`)
                ]),
                searchableLesson.culture ? [
                    searchableLesson.culture.titleKo,
                    searchableLesson.culture.titleZh,
                    searchableLesson.culture.summaryZh,
                    ...(searchableLesson.culture.paragraphs || []).map(paragraph => `${paragraph.ko} ${paragraph.zh} ${paragraph.guide}`),
                    ...(searchableLesson.culture.keyTerms || []).map(term => `${term.ko} ${term.zh}`)
                ].join(" ") : ""
            ].join(" ").toLowerCase();
            return haystack.includes(query.toLowerCase());
        }

        function renderActiveTab(lesson) {
            if (activeTab === "vocabulary") return renderVocabulary(lesson);
            if (activeTab === "dialogue") return renderDialogue(lesson);

            if (activeTab === "practice") return renderPractice(lesson);

        function getTabsElement() {
            return mainContent.querySelector(".tabs");
        }

        function tabsAreSticky() {
            const tabsElement = getTabsElement();
            if (!tabsElement) return false;

            const tabsTop = tabsElement.getBoundingClientRect().top;
            const contentTop = mainContent.getBoundingClientRect().top;
            return tabsTop <= contentTop + 1 || mainContent.scrollTop >= tabsElement.offsetTop - 1;
        }

        function scrollMainContent(target) {
            if (target === "tabs") {
                const tabsElement = getTabsElement();
                if (tabsElement) {
                    mainContent.scrollTo({ top: tabsElement.offsetTop, behavior: "auto" });
                }
                return;
            }

            if (target !== "preserve") {
                mainContent.scrollTo({ top: 0, behavior: "smooth" });
            }
        }

        function scrollActiveTabIntoView() {
            const tabsElement = getTabsElement();
            const activeButton = tabsElement?.querySelector(".tab-btn.active");
            if (!tabsElement || !activeButton) return;
            const targetLeft = activeButton.offsetLeft - ((tabsElement.clientWidth - activeButton.offsetWidth) / 2);
            tabsElement.scrollTo({
                left: Math.max(0, targetLeft),
                behavior: "smooth"
            });
        }

        function renderLoadedLesson(lesson, scrollTarget) {
            mobileTitle.textContent = `L2-${String(lesson.number).padStart(2, "0")} ${lesson.titleKo}`;
            mainContent.innerHTML = renderHero(lesson) + renderActiveTab(lesson);
            scrollMainContent(scrollTarget);
            window.requestAnimationFrame(scrollActiveTabIntoView);
        }

        async function renderMain(options = {}) {
            const { scrollTarget = "top" } = options;
            const lessonMeta = getLessonMeta();
            const runId = ++renderRunId;

            if (lessonCache.has(lessonMeta.id) || !lessonMeta.chunk) {
                const lesson = await loadLesson(lessonMeta.id);
                if (runId !== renderRunId || lesson.id !== activeLessonId) return;
                renderLoadedLesson(lesson, scrollTarget);
                preloadNextLesson(lesson.id);
                return;
            }

            mobileTitle.textContent = `L2-${String(lessonMeta.number).padStart(2, "0")} ${lessonMeta.titleKo}`;
            mainContent.innerHTML = renderHero(lessonMeta) + renderLoading(lessonMeta);
            scrollMainContent(scrollTarget);

            try {
                const lesson = await loadLesson(lessonMeta.id);
                if (runId !== renderRunId || lesson.id !== activeLessonId) return;
                renderLoadedLesson(lesson, scrollTarget);
                preloadNextLesson(lesson.id);
            } catch (error) {
                if (runId !== renderRunId) return;
                mainContent.innerHTML = renderHero(lessonMeta) + renderLoadError(lessonMeta);
                scrollMainContent(scrollTarget);
            }
        }

        function switchTab(tabId, options = {}) {
            if (!tabs.some(tab => tab.id === tabId) || tabId === activeTab) return;

            activeTab = tabId;
            renderMain({
                scrollTarget: options.keepSticky ? "tabs" : "top"
            });
        }

        function switchAdjacentTab(direction, options = {}) {
            const currentIndex = tabs.findIndex(tab => tab.id === activeTab);
            if (currentIndex < 0) return;

            const nextIndex = Math.min(Math.max(currentIndex + direction, 0), tabs.length - 1);
            if (nextIndex === currentIndex) return;
            switchTab(tabs[nextIndex].id, options);
        }

        function closeSidebar() {
            sidebar.classList.remove("open");
            sidebarOverlay.classList.remove("open");
        }

        lessonList.addEventListener("click", event => {
            const button = event.target.closest("[data-lesson-id]");
            if (!button) return;
            activeLessonId = button.dataset.lessonId;
            activeTab = "overview";
            renderLessonList();
            renderMain();
            if (window.innerWidth <= 920) closeSidebar();
        });

        mainContent.addEventListener("click", event => {
            const tabButton = event.target.closest("[data-tab]");
            if (tabButton) {
                switchTab(tabButton.dataset.tab, {
                    keepSticky: Boolean(tabButton.closest(".tabs")) && mobileSwipeQuery.matches
                });
                return;
            }

            const speakButton = event.target.closest("[data-speak-ko]");
            if (speakButton) {
                speakKorean(speakButton.dataset.speakKo, {
                    mode: speakButton.dataset.speakMode,
                    button: speakButton
                });
                return;
            }

            if (event.target.closest("[data-toggle-zh]")) {
                showChinese = !showChinese;
                localStorage.setItem(localeStorageKeys.showTranslation, String(showChinese));
                renderMain();
            }
        });

        function canStartTabSwipe(event) {
            if (!mobileSwipeQuery.matches || sidebar.classList.contains("open")) return false;

            const target = event.target instanceof Element ? event.target : event.target.parentElement;
            if (!target) return false;
            if (target.closest(".tabs")) return false;
            const interactive = target.closest("a, button, input, textarea, select, summary");
            return !interactive;
        }

        mainContent.addEventListener("touchstart", event => {
            if (event.touches.length !== 1 || !canStartTabSwipe(event)) {
                tabSwipeState.tracking = false;
                return;
            }

            const touch = event.touches[0];
            tabSwipeState.tracking = true;
            tabSwipeState.startX = touch.clientX;
            tabSwipeState.startY = touch.clientY;
            tabSwipeState.startedAt = Date.now();
        }, { passive: true });

        mainContent.addEventListener("touchend", event => {
            if (!tabSwipeState.tracking || event.changedTouches.length !== 1) return;

            tabSwipeState.tracking = false;
            const touch = event.changedTouches[0];
            const deltaX = touch.clientX - tabSwipeState.startX;
            const deltaY = touch.clientY - tabSwipeState.startY;
            const absX = Math.abs(deltaX);
            const absY = Math.abs(deltaY);
            const elapsed = Date.now() - tabSwipeState.startedAt;

            if (elapsed > 900 || absX < 54 || absX < absY * 1.35) return;

            switchAdjacentTab(deltaX < 0 ? 1 : -1, {
                keepSticky: true
            });
        }, { passive: true });

        mainContent.addEventListener("touchcancel", () => {
            tabSwipeState.tracking = false;
        }, { passive: true });

        lessonSearch.addEventListener("input", renderLessonList);
        menuToggle.addEventListener("click", () => {
            sidebar.classList.add("open");
            sidebarOverlay.classList.add("open");
        });
        sidebarOverlay.addEventListener("click", closeSidebar);

        document.addEventListener("click", event => {
            const toggle = event.target.closest("[data-language-toggle]");
            if (toggle) {
                const switcher = toggle.closest("[data-language-switcher]");
                const menu = switcher?.querySelector("[data-language-menu]");
                const shouldOpen = Boolean(menu?.hidden);
                closeLanguageMenus();
                if (menu) {
                    menu.hidden = !shouldOpen;
                    toggle.setAttribute("aria-expanded", String(shouldOpen));
                }
                event.stopPropagation();
                return;
            }

            const localeOption = event.target.closest("[data-locale-value]");
            if (localeOption) {
                setLocale(localeOption.dataset.localeValue);
                closeLanguageMenus();
                event.stopPropagation();
                return;
            }

            if (!event.target.closest("[data-language-switcher]")) {
                closeLanguageMenus();
            }
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeLanguageMenus();
        });

        lessons.forEach(applyLessonTranslationPacks);
        applyStaticLocale();
        renderLessonList();
        renderMain();
    </script>
</body>
</html>
